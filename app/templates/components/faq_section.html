{% set faqs = faqs|default([]) %}
{% if faqs %}
{% set title = title|default('Frequently Asked Questions') %}
{% set overline = overline|default('FAQ') %}
<section class="hlm-seo-faq hlm-section" aria-labelledby="hlm-faq-title">
	<div class="hlm-container">
		<div class="hlm-seo-faq__header hlm-text-center">
			{% if overline %}<div class="hlm-overline">{{ overline }}</div>{% endif %}
			<h2 id="hlm-faq-title" class="hlm-h2">{{ title }}</h2>
		</div>
		<div class="hlm-seo-faq__list">
			{% for faq in faqs %}
			<details class="hlm-seo-faq__item">
				<summary class="hlm-seo-faq__question">{{ faq.question }}</summary>
				<div class="hlm-seo-faq__answer">
					<p>{{ faq.answer }}</p>
				</div>
			</details>
			{% endfor %}
		</div>
	</div>
</section>
{% endif %}
